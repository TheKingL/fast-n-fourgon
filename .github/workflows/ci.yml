# CI de fast-n-fourgon.
#   - push sur main : lint et tests, puis image Docker publiée sur ghcr.io et release v1.0.<numéro du run> ;
#   - pull request vers main : lint et tests seulement.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thekingl/fast-n-fourgon
  VERSION: v1.0.${{ github.run_number }}

jobs:
  lint:
    name: Lint (ruff, hadolint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ruff (version de requirements-dev.txt)
        run: |
          pip install --disable-pip-version-check "$(grep -E '^ruff==' requirements-dev.txt)"
          ruff check --output-format=github .
      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances (requirements-dev.txt)
        run: pip install --disable-pip-version-check -r requirements-dev.txt
      - name: pytest
        run: pytest

  image:
    name: Image Docker (ghcr.io)
    needs: [lint, tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Image amd64 chargée en local, testée avant toute publication
      - name: Build amd64 pour le smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fast-n-fourgon:ci
          cache-from: type=gha
      - name: Smoke test (moteur, dashboard, exports, historique)
        run: |
          docker run --rm fast-n-fourgon:ci python main.py
          docker run --rm -v "$PWD/tests/smoke_image.py:/smoke.py:ro" fast-n-fourgon:ci python /smoke.py
          docker run -d --name dashboard -p 8501:8501 fast-n-fourgon:ci
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8501/_stcore/health && break
            sleep 1
          done
          curl -fsS http://localhost:8501/_stcore/health || { docker logs dashboard; exit 1; }
          docker rm -f dashboard

      - name: Connexion à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags et labels de l'image
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}
            type=sha
          labels: |
            org.opencontainers.image.title=fast-n-fourgon
            org.opencontainers.image.description=Dashboard Streamlit du moteur de consolidation des livraisons
            org.opencontainers.image.version=${{ env.VERSION }}
          annotations: |
            org.opencontainers.image.title=fast-n-fourgon
            org.opencontainers.image.description=Dashboard Streamlit du moteur de consolidation des livraisons
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Build et push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Connexion à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Archives de l'image publiée (une par architecture)
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          mkdir dist
          for arch in amd64 arm64; do
            docker pull --quiet --platform "linux/$arch" "$IMAGE:$VERSION"
            docker save --platform "linux/$arch" "$IMAGE:$VERSION" | gzip > "dist/fast-n-fourgon-$VERSION-linux-$arch.tar.gz"
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          ls -l dist
      - name: Création de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export SHORT_SHA="${GITHUB_SHA::7}"
          python3 -c 'import os, string, sys; sys.stdout.write(string.Template(sys.stdin.read()).substitute(os.environ))' \
            < .github/release-notes.md > notes.md
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "fast-n-fourgon $VERSION" \
            --notes-file notes.md --generate-notes
